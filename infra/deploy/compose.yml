name: subtick

# Self-hosted production stack (homelab), deployed by Dokploy as a Compose service: its
# Environment tab holds what .env.example lists, and Traefik routes web, /api and S3 by the labels
# below on dokploy-network. The recorder runs separately (apps/recorder/README.md) with
# --network host and reaches Postgres, Redis, S3 and the api on the loopback ports below.
#
# Dokploy runs `docker compose` from inside its container, so relative bind mounts would point at
# paths only it can see: everything mounted here is an absolute host path or inline.

# api, parser, steam and migrate share one image. Only migrate builds it: four identical builds in
# parallel each run their own `bun install`, and one flaky download fails the whole deploy. The
# others never pull it, so they wait for that build.
x-server: &server
  image: subtick-server
  pull_policy: never
  env_file: .env
  environment: &server-env
    DATABASE_URL: postgres://subtick:${POSTGRES_PASSWORD}@postgres:5432/subtick
    REDIS_URL: redis://redis:6379
    S3_ENDPOINT: http://seaweedfs:8333
    S3_DISK_STATUS_URL: http://seaweedfs:8080/status
    # The hosts Traefik routes below, as the origins the app links to.
    PUBLIC_URL: https://${PUBLIC_HOST:?}
    S3_PUBLIC_ENDPOINT: https://${S3_HOST:?}
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: subtick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: subtick
    ports: ['127.0.0.1:${POSTGRES_PORT:-55432}:5432']
    volumes: ['${DATA_DIR:?}/postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U subtick']
      interval: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:${REDIS_PORT:-56379}:6379']
    volumes: ['${DATA_DIR}/redis:/data']
    restart: unless-stopped

  # Published on all interfaces: the reverse proxy serves it as S3_PUBLIC_ENDPOINT for clip URLs.
  seaweedfs:
    image: chrislusf/seaweedfs:4.12
    # On two networks it would advertise whichever IP it finds first (dokploy-network's, which the
    # rest of the stack can't reach); its service name resolves on both.
    command: server -ip=seaweedfs -ip.bind=0.0.0.0 -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports: ['127.0.0.1:${S3_PORT:-8333}:8333']
    volumes:
      - '${DATA_DIR}/seaweedfs:/data'
      - '${S3_CONFIG_FILE:?absolute host path to s3.json}:/etc/seaweedfs/s3.json:ro'
    networks: [default, dokploy-network]
    labels:
      - traefik.enable=true
      - traefik.http.routers.subtick-s3.rule=Host(`${S3_HOST:?}`)
      - traefik.http.routers.subtick-s3.entrypoints=websecure
      - traefik.http.routers.subtick-s3.tls.certresolver=letsencrypt
      - traefik.http.services.subtick-s3.loadbalancer.server.port=8333
    restart: unless-stopped

  # infra/seaweedfs/init.sh, inline (see the note at the top). $$ is a literal $ for compose.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.12
    depends_on: [seaweedfs]
    entrypoint:
      - /bin/sh
      - -ec
      - |
        filer_ready() {
          out=$$(echo "fs.ls /" | weed shell -master=seaweedfs:9333 2>&1) || return 1
          echo "$$out" | grep -q 'filers: \[[0-9a-z]' && ! echo "$$out" | grep -q 'error'
        }
        until filer_ready; do sleep 1; done
        weed shell -master=seaweedfs:9333 <<'CMD'
        s3.bucket.create -name demos
        s3.bucket.create -name clips
        fs.configure -locationPrefix=/buckets/demos/ -ttl=30d -apply
        CMD
    restart: on-failure

  migrate:
    <<: *server
    build: { context: ../.., dockerfile: infra/deploy/server.Dockerfile }
    pull_policy: build
    command: ['bun', 'packages/db/src/migrate.ts']
    depends_on: { postgres: { condition: service_healthy } }
    restart: on-failure

  api:
    <<: *server
    command: ['bun', 'apps/api/src/index.ts']
    environment:
      <<: *server-env
      API_PORT: 3000
    # Loopback only, for the recorder; browsers come through Traefik.
    ports: ['127.0.0.1:${API_PORT:-53000}:3000']
    networks: [default, dokploy-network]
    labels:
      - traefik.enable=true
      - traefik.http.routers.subtick-api.rule=Host(`${PUBLIC_HOST:?}`) && PathPrefix(`/api`)
      - traefik.http.routers.subtick-api.entrypoints=websecure
      - traefik.http.routers.subtick-api.tls.certresolver=letsencrypt
      - traefik.http.services.subtick-api.loadbalancer.server.port=3000
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  parser:
    <<: *server
    command: ['bun', 'apps/parser/src/main.ts']
    depends_on:
      migrate: { condition: service_completed_successfully }

  steam:
    <<: *server
    command: ['bun', 'apps/steam/src/main.ts']
    # Keeps the bot's Steam refresh token (steam-bot/) across restarts.
    volumes: ['${DATA_DIR}/scratch/steam:/data']
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    image: subtick-web
    build: { context: ../.., dockerfile: infra/deploy/web.Dockerfile }
    networks: [default, dokploy-network]
    labels:
      - traefik.enable=true
      - traefik.http.routers.subtick-web.rule=Host(`${PUBLIC_HOST:?}`) && !PathPrefix(`/api`)
      - traefik.http.routers.subtick-web.entrypoints=websecure
      - traefik.http.routers.subtick-web.tls.certresolver=letsencrypt
      - traefik.http.services.subtick-web.loadbalancer.server.port=80
    restart: unless-stopped

networks:
  # Traefik's ingress network (homelab/dokploy), watched by its docker provider.
  dokploy-network:
    external: true
