# Headless screen on the NVIDIA GPU: no monitor attached, a virtual 1920x1080 framebuffer.
Section "ServerLayout"
    Identifier "Layout0"
    Screen 0 "Screen0"
EndSection

Section "Device"
    Identifier "Device0"
    Driver "nvidia"
    BusID "PCI:1:0:0"
    Option "AllowEmptyInitialConfiguration" "True"
    Option "ConnectedMonitor" "DFP-0"
    # Without a monitor the output boots at 1024x768, and CS2 keeps its window inside the desktop.
    Option "MetaModes" "1600x900 +0+0"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Device0"
    DefaultDepth 24
    Option "AllowEmptyInitialConfiguration" "True"
    SubSection "Display"
        Depth 24
        Virtual 1920 1080
    EndSubSection
EndSection
