// The look of every subtick clip. Executed at launch and again before each demo loads.

// No demo playback bar, build watermark, TrueView badge or telemetry.
demo_ui_mode 0
r_show_build_info 0
cl_trueview_show_status 0
cl_hud_telemetry_frametime_show 0
cl_hud_telemetry_ping_show 0
cl_hud_telemetry_net_misdelivery_show 0

// The player's own HUD (health, armor, ammo, killfeed); no x-ray outlines or names through walls.
cl_draw_only_deathnotices 0
spec_show_xray 0
hud_showtargetid 0

// HLAE paces capture itself; never cap the render loop.
fps_max 0
